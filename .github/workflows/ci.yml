name: CI Security Build and Push

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  build-scan-push:
    name: Build Scan and Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: api
            context: ./apps/api
            repository: production-devsecops-platform-dev-api

          - service: worker
            context: ./apps/worker
            repository: production-devsecops-platform-dev-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Show workflow context
        shell: bash
        run: |
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Repository owner: ${GITHUB_REPOSITORY_OWNER}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Service: ${{ matrix.service }}"
          echo "ECR repository: ${{ matrix.repository }}"

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            --tag "${LOCAL_IMAGE}" \
            "${{ matrix.context }}"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Show target AWS role
        if: github.event_name == 'push'
        run: |
          echo "Target role: arn:aws:iam::771650096212:role/production-devsecops-platform-dev-github-actions"

      - name: Configure AWS credentials with GitHub OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::771650096212:role/production-devsecops-platform-dev-github-actions
          role-session-name: gha-${{ matrix.service }}-${{ github.run_id }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
          unset-current-credentials: true

      - name: Verify AWS identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - name: Tag Docker image
        if: github.event_name == 'push'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REMOTE_IMAGE="${ECR_REGISTRY}/${{ matrix.repository }}:${IMAGE_TAG}"

          docker tag \
            "${LOCAL_IMAGE}" \
            "${REMOTE_IMAGE}"

          echo "REMOTE_IMAGE=${REMOTE_IMAGE}" >> "$GITHUB_ENV"

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push'
        shell: bash
        run: |
          docker push "${REMOTE_IMAGE}"

          echo "Published image:"
          echo "${REMOTE_IMAGE}"

      - name: Write job summary
        if: github.event_name == 'push'
        shell: bash
        run: |
          {
            echo "## Published Docker image"
            echo ""
            echo "- Service: \`${{ matrix.service }}\`"
            echo "- Repository: \`${{ matrix.repository }}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Image: \`${REMOTE_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"